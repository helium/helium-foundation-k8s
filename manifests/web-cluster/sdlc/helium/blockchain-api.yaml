apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: blockchain-api
  name: blockchain-api
  namespace: helium
spec:
  selector:
    matchLabels:
      app: blockchain-api
  template:
    metadata:
      labels:
        app: blockchain-api
        security-group: public-rds-access
    spec:
      serviceAccountName: public-monitoring-rds-monitoring-user-access
      containers:
        - name: blockchain-api
          image: public.ecr.aws/v0j6k5v6/blockchain-api:0.3.19
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: SOLANA_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: helius-rpc-url
                  key: secret
            - name: PG_HOST
              value: monitoring-rds.cnigyps3bpgz.us-east-1.rds.amazonaws.com
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              value: monitoring
            - name: AWS_REGION
              value: us-east-1
            - name: PG_NAME
              value: monitoring
            - name: SOLANA_CLUSTER
              value: devnet
            - name: PUBLIC_URL
              value: https://blockchain-api.web.test-helium.com
            - name: HPL_CRONS_TASK_QUEUE
              value: H39gEszvsi6AT4rYBiJTuZHJSF5hMHy6CKGTd7wzhsg7
            - name: FEE_PAYER_WALLET_PATH
              value: /usr/src/app/keys/keypair.json
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sentry-dsn
                  key: secret
            - name: ACCOUNT_INDEXER_URL
              value: "https://account-sink.web.test-helium.com"
            - name: ASSET_OWNER_INDEXER_URL
              value: "https://asset-ownership.web.test-helium.com"
            - name: ACCOUNT_INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: refresh-password
                  key: password
            - name: ASSET_OWNER_INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: refresh-password
                  key: password
            - name: ORACLE_SIGNER
              value: dor5y9KAG6mVGFquXr8ipmm7GVLZefiNiCjvER58kPB
            - name: ORACLE_URL
              value: https://hnt-rewards.oracle.test-helium.com
            - name: JUPITER_API_URL
              value: "https://api.jup.ag"
            - name: JUPITER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jupiter-api-key
                  key: jupiter-api-key
            - name: ORACLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unlimited-rate-api-key
                  key: secret
            - name: ONBOARDING_ENDPOINT
              value: "https://onboarding.web.test-helium.com/api/v3"
            - name: DUNE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dune-api-key
                  key: dune-api-key
            # Set HPL_TX_VERSION=v0 and redeploy to force v0 transactions.
            # - name: HPL_TX_VERSION
            #   value: v0

          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/v1/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          volumeMounts:
            - name: keypair
              mountPath: /usr/src/app/keys
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 2000Mi
            limits:
              cpu: 1000m
              memory: 3000Mi
      volumes:
        - name: keypair
          secret:
            secretName: my-helium-keypair
            items:
              - key: keypair.json
                path: keypair.json
---
apiVersion: v1
kind: Service
metadata:
  name: blockchain-api
  namespace: helium
spec:
  ports:
    - port: 3000
      protocol: TCP
      targetPort: http
  selector:
    app: blockchain-api
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blockchain-api
  namespace: helium
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blockchain-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
